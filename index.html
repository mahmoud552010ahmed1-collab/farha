<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>استني SCAN يا احلى بطوووووط</title>
<style>
*{box-sizing:border-box}
body{
 margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
 background:linear-gradient(135deg,#fff5f8,#ffe4ed);
 font-family:Arial,"Tahoma",sans-serif; color:#d52b68;
}
.card{
 width:min(90vw,520px); background:#fff; border-radius:34px; padding:28px 22px 34px;
 box-shadow:0 18px 50px rgba(210,50,100,.18); text-align:center;
}
h1{font-size:30px;margin:6px 0 20px}
p{font-size:20px;line-height:1.8;margin:0}
.heart{font-size:48px;margin-top:12px}
</style>
</head>
<body>
<div class="card">
  <h1>💗 استني المفاجأة 💗</h1>
  <p>اضغطي على الزر علشان تبدأ الهدية</p>
  <div class="heart">💋❤️</div>
</div>
</body>
</html>
